# Staged CI (owned by 05_code_plans/02, #29). Cheapest-first so failures surface fast:
#
#   fast          -> lint + typecheck + parity gate (F2) + core unit tests   (every PR, minutes)
#   export-smoke  -> export profile installed; export/package/manifest wiring (every PR, < ~10 min)
#   android-*     -> Gradle assembleDebug for both modules                   (every PR, self-skips*)
#
# * The Android job needs the git-ignored vendored native deps (jniLibs/, aarLibs/, cpp/includes/
#   google protobuf headers) — same out-of-band provisioning story as the ORT-training wheel. On a
#   bare hosted runner those are absent, so the job SELF-SKIPS with a warning rather than failing
#   spuriously (mirrors .github/workflows/ort-training-smoke.yml). How the native deps reach CI —
#   rebuild vs. cached artifact vs. private storage — is decided alongside #30 (AAR) / this plan.
#
# No PR job downloads a large model (assert via logs): fast/export-smoke use only tiny fixtures; the
# generate_artifacts + 1-token desktop leg + device train->merge->generate->RAG run in device.yml
# (manual + nightly), never on a PR.

name: ci

on:
  push:
    branches: [main, restructure]
  pull_request: {}

jobs:
  fast:
    name: fast (lint + typecheck + parity + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync core + dev (Python 3.10, no onnxruntime provider)
        run: uv sync --frozen --group dev --python 3.10
      - name: Lint
        run: make lint
      - name: Typecheck
        run: make typecheck
      - name: Parity gate (F2 — enums/schemas vs. Kotlin/C++ mirrors)
        run: make parity
      - name: Unit tests
        run: make test

  export-smoke:
    name: export-smoke (export/package/manifest wiring)
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      # Export profile needs Python >= 3.11 (optimum-onnx pulls onnxruntime >= 1.24). Runs the
      # export-profile tests that self-skip in the fast job's core env.
      - name: Sync export profile + dev (Python 3.12)
        run: uv sync --extra export --group dev --python 3.12
      - name: Export/package/manifest smoke
        run: make test-smoke

  android-assemble:
    name: android-assemble (self-skips without vendored native deps)
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check for the vendored native deps
        id: nativedeps
        working-directory: android/MobileTransformersApp
        run: |
          if [ -d MobileTransformers/src/main/aarLibs ] && [ -d MobileTransformers/src/main/jniLibs ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Vendored native deps (aarLibs/, jniLibs/) absent; skipping Android assemble (see #29/#30 for CI provisioning)."
          fi
      - name: Assemble SDK + sample app (debug)
        if: steps.nativedeps.outputs.present == 'true'
        working-directory: android/MobileTransformersApp
        run: ./gradlew :MobileTransformers:assembleDebug :app:assembleDebug
