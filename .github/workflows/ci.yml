# Staged CI. Cheapest-first so failures surface fast:
#
#   fast          -> lint + typecheck + parity + guards (F2) + core unit tests (every PR, minutes)
#   kotlin-test   -> :MobileTransformers JVM unit tests                        (every PR, no NDK)
#   cpp-test      -> host googletest over the ORT-free C++ headers              (every PR, no NDK)
#   export-smoke  -> export profile installed; export/package/manifest wiring  (every PR, < ~10 min)
#   android-*     -> Gradle assembleDebug for both modules                     (every PR, self-skips*)
#
# The Kotlin JVM suite needs only the Kotlin compiler + Android SDK stubs — NOT the vendored native
# libraries — so it runs on every PR. It was previously running only on the author's laptop.
#
# * The Android ASSEMBLE job needs the git-ignored vendored native deps. On a bare hosted runner those
#   are absent, so the job SELF-SKIPS with a warning rather than failing spuriously (mirrors
#   .github/workflows/ort-training-smoke.yml). How the native deps reach CI — rebuild vs. cached
#   artifact vs. private storage — is still an open decision. See docs/RELEASE_CHECKLIST.md.
#
# No PR job downloads a large model (assert via logs): fast/export-smoke use only tiny fixtures; the
# generate_artifacts + 1-token desktop leg + device train->merge->generate->RAG run in device.yml
# (manual + nightly), never on a PR.

name: ci

# DISABLED (2026-08-08): automatic triggers removed — these workflows are not in use yet, and the
# native-dependency provisioning question they depend on is unresolved, so every run either self-skips
# or fails for reasons unrelated to the change under test. A red badge nobody acts on is worse than no
# badge: it trains everyone to ignore CI.
#
# They remain fully intact and MANUALLY runnable (Actions -> select workflow -> "Run workflow").
# To re-enable, restore the original `on:` block recorded directly below.
#
# ORIGINAL:
#   on:
#     push:
#       branches: [main, restructure]
#       tags: ['v*']
#     pull_request: {}

on:
  workflow_dispatch: {}

jobs:
  fast:
    name: fast (lint + typecheck + parity + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync core + dev (Python 3.10, no onnxruntime provider)
        run: uv sync --frozen --group dev --python 3.10
      - name: Lint
        run: make lint
      - name: Typecheck
        run: make typecheck
      - name: Parity gate (F2 — enums/schemas vs. Kotlin/C++ mirrors)
        run: make parity
      - name: Guards (secret reads, registry dispatch, plan identifiers, machine paths)
        run: make guard
      - name: Docs gate (markdown links, CLI table, Kotlin facade symbols)
        # `--frozen` is load-bearing, not a nicety: a bare `uv run` validates every source in the
        # lock before executing, and `onnxruntime-training` resolves to a git-ignored 662 MB wheel
        # that no runner has. Without it this step dies on a missing training wheel it never needed.
        run: uv run --frozen pytest tests/unit/test_docs.py -q
      - name: Unit tests
        run: make test

  kotlin-test:
    name: kotlin-test (SDK JVM unit tests)
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/MobileTransformers/**/*.gradle.kts', 'android/MobileTransformers/gradle/libs.versions.toml') }}
      # JVM-only: no NDK, no vendored native libs. `testDebugUnitTest` compiles Kotlin and runs the
      # facade/hub/packages/rag/runtime/training suites.
      - name: SDK JVM unit tests
        working-directory: android/MobileTransformers
        run: ./gradlew :MobileTransformers:testDebugUnitTest
      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-test-report
          path: android/MobileTransformers/MobileTransformers/build/reports/tests/testDebugUnitTest

  cpp-test:
    name: cpp-test (host googletest, ORT-free headers)
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Host toolchain only — the shipping library needs the NDK + ONNX Runtime, but handoff_io.h,
      # constants/merger_variant.h and mem_probe.h are ORT-free and carry the fail-closed logic.
      - name: C++ host unit tests
        run: make test-cpp

  export-smoke:
    name: export-smoke (export/package/manifest wiring)
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      # Export profile needs Python >= 3.11 (optimum-onnx pulls onnxruntime >= 1.24). Runs the
      # export-profile tests that self-skip in the fast job's core env.
      - name: Sync export profile + dev (Python 3.12)
        run: uv sync --extra export --group dev --python 3.12
      - name: Export/package/manifest smoke
        run: make test-smoke

  android-assemble:
    name: android-assemble (self-skips without vendored native deps)
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check for the vendored native deps
        id: nativedeps
        working-directory: android/MobileTransformers
        run: |
          # jniLibs/ is the only vendored input the native build still needs. aarLibs/ was dropped as a
          # Gradle dependency (build.gradle.kts documents the .so-from-jniLibs decision) and the
          # protobuf headers under cpp/includes/ went with weight_serializer.cpp — the flat
          # per-tensor .bin files are raw external data, so nothing on device parses ONNX protobuf.
          if [ -d MobileTransformers/src/main/jniLibs ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Vendored native libs (src/main/jniLibs) absent; skipping Android assemble. Run scripts/fetch_native_deps.sh, or see docs/ARCHITECTURE.md."
          fi
      - name: Assemble SDK + sample app (debug)
        if: steps.nativedeps.outputs.present == 'true'
        working-directory: android/MobileTransformers
        run: ./gradlew :MobileTransformers:assembleDebug :MobileTransformersApp:assembleDebug

      # On a tag, also produce the release AAR. scripts/android_build_aar.sh verifies that every ABI
      # directory the AAR ships actually contains libmobiletransformers.so — an AAR with an ABI dir
      # but no project library fails at System.loadLibrary on the consumer's device.
      - name: Build the release AAR (tags only)
        if: steps.nativedeps.outputs.present == 'true' && startsWith(github.ref, 'refs/tags/v')
        run: scripts/android_build_aar.sh
      - name: Upload the release AAR (tags only)
        if: steps.nativedeps.outputs.present == 'true' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: mobiletransformers-android-aar
          path: android/MobileTransformers/MobileTransformers/build/outputs/aar/*-release.aar
